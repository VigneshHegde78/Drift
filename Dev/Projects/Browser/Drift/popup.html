<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- MAIN DASHBOARD VIEW -->
    <div id="view-dashboard" class="view active">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <svg class="brand-logo" width="26" height="26" viewBox="0 0 28 28" fill="none">
            <ellipse cx="14" cy="15" rx="10" ry="6.5" transform="rotate(-30 14 15)" stroke="#315BDB" stroke-width="3" stroke-linecap="round"/>
            <circle cx="8" cy="8" r="3" fill="#315BDB"/>
          </svg>
          <h1 class="brand-name">Drift</h1>
        </div>
        <button id="btn-open-settings" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <!-- Time Filter Tabs -->
      <div class="tabs-container">
        <button class="tab-btn active" data-range="today">Today</button>
        <button class="tab-btn" data-range="week">This Week</button>
        <button class="tab-btn" data-range="all">All Time</button>
      </div>

      <!-- Hero Total Time -->
      <section class="hero-card">
        <div class="hero-time" id="hero-total-time">0m</div>
        <div class="hero-label">Total browsing time</div>
      </section>

      <!-- Weekly Bar Chart -->
      <section class="chart-section" id="weekly-chart-section">
        <div class="bars-row" id="bars-container">
          <!-- 7 Bars will be populated via JS -->
        </div>
      </section>

      <!-- Highlights Grid (2 Columns) -->
      <section class="highlights-grid">
        <!-- Shorts & Reels Card -->
        <div class="highlight-card">
          <div class="card-icon red-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <div class="card-text">
            <div class="card-title">Shorts & Reels</div>
            <div class="card-val" id="stat-swipes-val">0 swipes</div>
          </div>
        </div>

        <!-- Focus Time Card -->
        <div class="highlight-card">
          <div class="card-icon green-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
          </div>
          <div class="card-text">
            <div class="card-title">Focus time</div>
            <div class="card-val" id="stat-focus-val">0m</div>
          </div>
        </div>
      </section>

      <!-- Top Websites Section -->
      <section class="top-sites-section">
        <div class="section-header">
          <h2 class="section-title">Top websites</h2>
          <button class="see-all-btn" id="btn-see-all">See all →</button>
        </div>
        <div class="sites-list" id="sites-list-container">
          <div class="empty-state">No browsing recorded yet today.</div>
        </div>
      </section>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
      <header class="header">
        <button id="btn-back-settings" class="back-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Settings</span>
        </button>
      </header>

      <div class="settings-list">
        <!-- Floating Pill Toggle -->
        <div class="setting-item">
          <div class="setting-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div class="setting-info">
            <div class="setting-title">Floating pill</div>
            <div class="setting-desc">Show time on all websites</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-floating-pill" checked />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Idle Detection Toggle -->
        <div class="setting-item">
          <div class="setting-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </div>
          <div class="setting-info">
            <div class="setting-title">Idle detection</div>
            <div class="setting-desc">Pause when you're inactive</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-idle-detection" checked />
            <span class="slider"></span>
          </label>
        </div>

        <!-- Website Categories -->
        <div class="setting-item interactive" id="btn-categories-setting">
          <div class="setting-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="setting-info">
            <div class="setting-title">Website categories</div>
            <div class="setting-desc">Productive, Distracting, Neutral</div>
          </div>
          <div class="setting-chevron">›</div>
        </div>

        <!-- Manage Data -->
        <div class="setting-item interactive" id="btn-data-setting">
          <div class="setting-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </div>
          <div class="setting-info">
            <div class="setting-title">Data</div>
            <div class="setting-desc">Manage or clear local data</div>
          </div>
          <div class="setting-chevron">›</div>
        </div>
      </div>

      <!-- Data Actions Modal/Section (Collapsible) -->
      <div class="data-actions-card" id="data-actions-box">
        <button class="action-btn secondary" id="btn-reset-today">Reset today's data</button>
        <button class="action-btn danger" id="btn-clear-all">Clear all history</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
