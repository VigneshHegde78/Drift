<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- DASHBOARD VIEW -->
    <main id="view-dashboard" class="view active">
      <header class="header">
        <div class="brand">
          <svg class="brand-logo" width="24" height="24" viewBox="0 0 28 28" fill="none">
            <ellipse cx="14" cy="15" rx="10" ry="6.5" transform="rotate(-30 14 15)" stroke="#315BDB" stroke-width="3" stroke-linecap="round"/>
            <circle cx="8" cy="8" r="3" fill="#315BDB"/>
          </svg>
          <span class="brand-name">Drift</span>
        </div>
        <button id="btn-open-settings" class="icon-btn" title="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <nav class="tabs">
        <button class="tab-btn active" data-range="today">Today</button>
        <button class="tab-btn" data-range="week">This Week</button>
        <button class="tab-btn" data-range="all">All Time</button>
      </nav>

      <!-- Hero Total Time -->
      <section class="hero">
        <div class="hero-time" id="hero-total-time">0m</div>
        <div class="hero-label">Total browsing time</div>
      </section>

      <!-- Category Breakdown (Productive, Distracting, Neutral) -->
      <section class="category-breakdown">
        <div class="breakdown-header">
          <span class="breakdown-title" id="breakdown-title">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="breakdown-label">Analyzing...</span>
          </span>
          <span class="breakdown-ratio" id="breakdown-ratio">0%</span>
        </div>
        <div class="split-track">
          <div class="split-segment seg-productive" id="seg-productive" style="width: 0%;"></div>
          <div class="split-segment seg-distracting" id="seg-distracting" style="width: 0%;"></div>
          <div class="split-segment seg-neutral" id="seg-neutral" style="width: 0%;"></div>
        </div>
        <div class="breakdown-legend">
          <div class="legend-tag tag-productive">
            <span class="tag-dot prod"></span>
            <span class="tag-label">Productive</span>
            <span class="tag-time" id="txt-prod-time">0m</span>
          </div>
          <div class="legend-tag tag-distracting">
            <span class="tag-dot dist"></span>
            <span class="tag-label">Distracting</span>
            <span class="tag-time" id="txt-dist-time">0m</span>
          </div>
          <div class="legend-tag tag-neutral">
            <span class="tag-dot neut"></span>
            <span class="tag-label">Neutral</span>
            <span class="tag-time" id="txt-neut-time">0m</span>
          </div>
        </div>
      </section>

      <!-- 7-Day Chart with Perfect Baseline Alignment -->
      <section class="chart" id="bars-container"></section>

      <!-- Highlight Cards (Focus Time & Distracting Time) -->
      <section class="highlights">
        <article class="highlight-card">
          <span class="card-icon green">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
          </span>
          <div class="card-body">
            <span class="card-title">Focus time</span>
            <span class="card-val" id="stat-focus-val">0m</span>
          </div>
        </article>

        <article class="highlight-card">
          <span class="card-icon red">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </span>
          <div class="card-body">
            <span class="card-title">Distracting</span>
            <span class="card-val" id="stat-dist-card-val">0m</span>
          </div>
        </article>
      </section>

      <!-- Top Websites with Category Badges -->
      <section class="sites">
        <div class="sites-header">
          <span class="sites-title">Top websites</span>
          <button class="see-all-btn" id="btn-see-all">See all →</button>
        </div>
        <div class="sites-list" id="sites-list-container">
          <div class="empty-state">No browsing recorded yet today.</div>
        </div>
      </section>
    </main>

    <!-- SETTINGS VIEW -->
    <aside id="view-settings" class="view">
      <header class="header">
        <button id="btn-back-settings" class="back-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Settings</span>
        </button>
      </header>

      <section class="settings-list">
        <label class="setting-item">
          <span class="setting-info">
            <span class="setting-title">Floating pill</span>
            <span class="setting-desc">Show time on all websites</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="toggle-floating-pill" checked />
            <span class="slider"></span>
          </span>
        </label>

        <label class="setting-item">
          <span class="setting-info">
            <span class="setting-title">Idle detection</span>
            <span class="setting-desc">Pause when you're inactive</span>
          </span>
          <span class="switch">
            <input type="checkbox" id="toggle-idle-detection" checked />
            <span class="slider"></span>
          </span>
        </label>

        <div class="setting-item interactive" id="btn-data-setting">
          <span class="setting-info">
            <span class="setting-title">Data</span>
            <span class="setting-desc">Manage or clear local data</span>
          </span>
          <span class="chevron">›</span>
        </div>
      </section>

      <div class="data-actions" id="data-actions-box">
        <button class="action-btn" id="btn-reset-today">Reset today's data</button>
        <button class="action-btn danger" id="btn-clear-all">Clear all history</button>
      </div>
    </aside>

    <script src="popup.js"></script>
  </body>
</html>
